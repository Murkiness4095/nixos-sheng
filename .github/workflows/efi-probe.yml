name: EFI probe
on:
  push:
    branches: [codex/efi-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build -L .#u-boot-efi-probe -o result-probe
      - name: Check the probe image
        run: |
          test "$(stat -Lc %s result-probe/boot.img)" -lt $((192 * 1024 * 1024))
          strings result-probe/u-boot.bin | grep -F 'Test EFI hello'
          sha256sum result-probe/boot.img
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-efi-probe
          path: result-probe/boot.img
          if-no-files-found: error
