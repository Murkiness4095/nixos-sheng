name: EFI experiments

on:
  pull_request:
    paths:
      - ".github/workflows/efi.yml"
      - "tests/systemd-boot-generations.nix"
  workflow_dispatch:
    inputs:
      task:
        description: EFI experiment to run
        type: choice
        required: true
        default: single
        options: [single, dual, generations, sheng-generations]

permissions:
  contents: read

jobs:
  efi-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'single' || inputs.task == 'dual') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build -L  .#${{ inputs.task == 'dual' && 'u-boot-efi-probe' || 'u-boot-efi-probe-single' }} -o result-probe
      - name: Check the probe image
        run: |
          test "$(stat -Lc %s result-probe/boot.img)" -lt $((192 * 1024 * 1024))
          strings result-probe/u-boot.bin | grep -F 'Test EFI hello'
          strings result-probe/u-boot.bin | grep -F "part number scsi 0 ${{ inputs.task == 'dual' && 'linux' || 'userdata' }} partnum"
          sha256sum result-probe/boot.img
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.task == 'dual' && 'sheng-efi-probe-dual' || 'sheng-efi-probe-single' }}
          path: result-probe/boot.img
          if-no-files-found: error
  efi-generations:
    if: ${{ github.event_name == 'pull_request' || inputs.task == 'generations' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Verify NixOS systemd-boot update and rollback
        run: nix build -L .#checks.x86_64-linux.systemd-boot-generations
  sheng-generations:
    if: ${{ inputs.task == 'sheng-generations' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Export sheng EFI candidate
        run: |
          set -euo pipefail
          nix build -L .#nixosConfigurations.sheng-efi-generations.config.system.build.toplevel
          mkdir evidence
          readlink -f result > evidence/system-path.txt
          git rev-parse HEAD > evidence/revision.txt
          cp flake.lock evidence/
          nix-store --export $(nix path-info -r ./result) | zstd -T0 -3 > evidence/closure.nar.zst
          (cd evidence && sha256sum closure.nar.zst > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-efi-generation-closure
          path: evidence/
          if-no-files-found: error
