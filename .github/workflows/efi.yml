name: EFI experiments

on:
  pull_request:
    paths:
      - ".github/workflows/efi.yml"
      - "modules/efi-install-image.nix"
      - "tests/systemd-boot-generations.nix"
  workflow_dispatch:
    inputs:
      esp_size_mib:
        description: ESP image size for install-bundle (MiB)
        type: choice
        default: "1024"
        options: ["512", "1024"]
      layout:
        description: Root layout for the hardware generation closure
        type: choice
        default: single
        options: [single, dual]
      task:
        description: EFI experiment to run
        type: choice
        required: true
        default: single
        options: [single, dual, generations, sheng-generations, internal-esp, install-bundle]

permissions:
  contents: read

jobs:
  install-bundle:
    if: ${{ inputs.task == 'install-bundle' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        layout: ${{ fromJSON(github.event_name == 'pull_request' && '["single","dual"]' || format('["{0}"]', inputs.layout)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Build matching rootfs, ESP and U-Boot images
        env:
          LAYOUT: ${{ matrix.layout }}
          ESP_SIZE_MIB: ${{ inputs.esp_size_mib || (matrix.layout == 'single' && '512' || '1024') }}
        run: |
          set -euo pipefail
          case "$LAYOUT" in
            single) config=sheng-efi-install; root=userdata ;;
            dual) config=sheng-dual-efi-install; root=linux ;;
            *) exit 1 ;;
          esac
          case "$ESP_SIZE_MIB" in
            512) esp_image=shengEspImage ;;
            1024) esp_image=shengEspImage1GiB ;;
            *) exit 1 ;;
          esac
          system=".#nixosConfigurations.$config.config"
          test "$(nix eval --raw "$system.sheng.rootfs.partlabel")" = "$root"
          nix build -L "$system.system.build.shengImage" -o result-root
          nix build -L "$system.system.build.$esp_image" -o result-esp
          nix build -L ".#u-boot-efi-internal-$LAYOUT" -o result-uboot
          mkdir bundle
          zstd -T0 -3 result-root/sheng-rootfs.sparse.img -o bundle/sheng-rootfs.sparse.img.zst
          cp result-esp/sheng-esp.sparse.img result-uboot/boot.img flake.lock bundle/
          {
            printf 'layout=%s\nroot_partlabel=%s\nesp_partlabel=sheng-esp\nconfiguration=%s\n' "$LAYOUT" "$root" "$config"
            printf 'revision=%s\n' "$(git rev-parse HEAD)"
            printf 'esp_size_mib=%s\nesp_logical_sector_bytes=4096\n' "$ESP_SIZE_MIB"
            printf 'system=%s\n' "$(nix eval --raw "$system.system.build.toplevel.outPath")"
          } > bundle/manifest.txt
          (cd bundle && sha256sum boot.img sheng-esp.sparse.img sheng-rootfs.sparse.img.zst flake.lock manifest.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-efi-install-${{ matrix.layout }}
          path: bundle/
          if-no-files-found: error
          compression-level: 0

  internal-esp:
    if: ${{ inputs.task == 'internal-esp' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: |
          nix build -L .#u-boot-efi-internal-dual
          strings result/u-boot.bin | grep -F 'sheng_boot_internal_efi=yes'
          strings result/u-boot.bin | grep -F 'bootefi_internal=' | grep -F 'part number scsi 0 linux partnum'
          sha256sum result/boot.img
      - run: |
          nix build -L .#u-boot-efi-internal-single -o result-single
          strings result-single/u-boot.bin | grep -F "sheng_boot_internal_efi=yes"
          strings result-single/u-boot.bin | grep -F "bootefi_internal=" | grep -F "part number scsi 0 userdata partnum"
          sha256sum result-single/boot.img
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-efi-internal-single
          path: result-single/boot.img
          if-no-files-found: error
      - run: |
          nix build -L .#u-boot-efi-internal-missing-esp -o result-missing
          strings result-missing/u-boot.bin | grep -F 'part number scsi 0 sheng-esp-absent espnum'
          sha256sum result-missing/boot.img
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-efi-internal-missing-esp
          path: result-missing/boot.img
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-efi-internal-dual
          path: result/boot.img
          if-no-files-found: error

  efi-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.task == 'single' || inputs.task == 'dual') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build -L  .#${{ inputs.task == 'dual' && 'u-boot-efi-probe' || 'u-boot-efi-probe-single' }} -o result-probe
      - name: Check the probe image
        run: |
          test "$(stat -Lc %s result-probe/boot.img)" -lt $((192 * 1024 * 1024))
          strings result-probe/u-boot.bin | grep -F 'Test EFI hello'
          strings result-probe/u-boot.bin | grep -F "part number scsi 0 ${{ inputs.task == 'dual' && 'linux' || 'userdata' }} partnum"
          sha256sum result-probe/boot.img
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.task == 'dual' && 'sheng-efi-probe-dual' || 'sheng-efi-probe-single' }}
          path: result-probe/boot.img
          if-no-files-found: error
  efi-generations:
    if: ${{ github.event_name == 'pull_request' || inputs.task == 'generations' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Verify NixOS systemd-boot update and rollback
        run: nix build -L .#checks.x86_64-linux.systemd-boot-generations
  sheng-generations:
    if: ${{ inputs.task == 'sheng-generations' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Export sheng EFI candidate
        env:
          CONFIGURATION: ${{ inputs.layout == 'dual' && 'sheng-dual-efi-generations' || 'sheng-efi-generations' }}
        run: |
          set -euo pipefail
          nix build -L ".#nixosConfigurations.$CONFIGURATION.config.system.build.toplevel"
          mkdir evidence
          nix build --impure --expr '((builtins.getFlake (toString ./.)).nixosConfigurations."'"$CONFIGURATION"'".extendModules { modules = [ { system.nixos.label = "efi-generation-2"; } ]; }).config.system.build.toplevel' -o result-second
          readlink -f result-second > evidence/second-system-path.txt
          readlink -f result > evidence/system-path.txt
          git rev-parse HEAD > evidence/revision.txt
          cp flake.lock evidence/
          nix-store --export $(nix path-info -r ./result ./result-second | sort -u) | zstd -T0 -3 > evidence/closure.nar.zst
          (cd evidence && sha256sum closure.nar.zst > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-efi-generation-closure
          path: evidence/
          if-no-files-found: error
